# Playtest deployment — GitHub Pages.
# The game is a fully static browser app (no build step, no bundler, no secrets:
# ui/vendor/three.module.js is vendored, all imports are relative), so the "build"
# is the repository content itself. Tests gate the deploy.
name: Deploy Playtest to GitHub Pages

on:
  push:
    branches: [feature/playtest-build-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite (44 tests, no dependencies to install)
        run: npm test
      - name: Configure Pages (creates/enables the site on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site (repository root — the game is served as-is)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

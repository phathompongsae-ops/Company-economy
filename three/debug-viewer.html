<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Company Economy — Debug Viewer</title>
<style>
  body { margin: 0; background: #1a1c22; color: #cfd3dc; font: 12px monospace; }
  #hud { position: fixed; top: 8px; left: 8px; background: #0009; padding: 8px 10px; border-radius: 6px; white-space: pre; }
  #hud button { font: inherit; margin-top: 6px; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
// Debug viewer — Three.js renders GameState; it owns NOTHING. The same headless sim that
// `npm run simulate` runs is imported unchanged and stepped round-by-round here.
// Every mesh carries userData.simId so visuals stay tied to stable simulation IDs.
import * as THREE from 'three';
import { createInitialState, CITY_V1 } from '../src/core/state.js';
import { playRound } from '../src/core/round.js';
import { SCENARIOS, withPlotFallback } from '../src/sim/scenarios.js';
import { computeCapabilities } from '../src/core/capabilities.js';

const state = createInitialState(7, ['balanced', 'premium']);
const policies = [SCENARIOS.balanced, SCENARIOS.premium];
const COMPANY_COLORS = [0xe0533f, 0x3f8fe0];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x232733);
const W = CITY_V1.grid.w, H = CITY_V1.grid.h;
const aspect = innerWidth / innerHeight, span = 13;
const camera = new THREE.OrthographicCamera(-span * aspect, span * aspect, span, -span, 0.1, 100);
camera.position.set(W / 2 + 14, 18, H / 2 + 14);       // 2.5D pseudo-isometric angle
camera.lookAt(W / 2, 0, H / 2);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);                              // crisp pixel-style look
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffe6c0, 0.9); sun.position.set(6, 12, 4); scene.add(sun);

// ground + simple road cross
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 6, H + 6), new THREE.MeshLambertMaterial({ color: 0x3a4436 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(W / 2, -0.05, H / 2); scene.add(ground);
for (const [w, h, x, z] of [[W + 2, 1.6, W / 2, 10.5], [1.6, H + 2, 11, H / 2]]) {
  const road = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({ color: 0x50555e }));
  road.rotation.x = -Math.PI / 2; road.position.set(x, 0.0, z); scene.add(road);
}

const KIND_STYLE = { house: [0.8, 0.6, 0x9c7b56], condo: [1.0, 2.2, 0x7b8aa0], hotel: [1.4, 2.8, 0xb08ac0] };
for (const b of CITY_V1.buildings) {
  const [w, h, color] = KIND_STYLE[b.kind];
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshLambertMaterial({ color }));
  m.position.set(b.x, h / 2, b.y); m.userData.simId = b.id; scene.add(m);
}
const storeMeshes = {};
for (const s of CITY_V1.stores) {
  const size = s.type === 'convenience' ? 1.1 : s.type === 'supermarket' ? 1.8 : 1.5;
  const m = new THREE.Mesh(new THREE.BoxGeometry(size, 1, size), new THREE.MeshLambertMaterial({ color: 0xd8c26a }));
  m.position.set(s.x, 0.5, s.y); m.userData.simId = s.id; scene.add(m);
  storeMeshes[s.id] = m;
}
const hqMeshes = [];
function syncHq() {
  state.companies.forEach((co, i) => {
    if (co.hqPlotId && !hqMeshes[i]) {
      const m = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.6, 4), new THREE.MeshLambertMaterial({ color: COMPANY_COLORS[i] }));
      m.position.set(co.x, 0.8, co.y); m.userData.simId = co.id; scene.add(m);
      hqMeshes[i] = m;
    }
  });
}

// representative purchase walkers: spawned from real PurchaseEvents of the resolved round
const walkers = [];
function spawnWalkers(events) {
  for (const w of walkers) scene.remove(w.mesh);
  walkers.length = 0;
  const purchases = events.filter((e) => e.t === 'PurchaseEvent').slice(0, 40);
  for (const p of purchases) {
    const home = CITY_V1.buildings.find((b) => b.id === p.from);
    const store = CITY_V1.stores.find((s) => s.id === p.storeId);
    if (!home || !store) continue;
    const ci = state.companies.findIndex((c) => c.id === p.companyId);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), new THREE.MeshLambertMaterial({ color: COMPANY_COLORS[ci] ?? 0xffffff }));
    mesh.userData.simId = p.consumerId;
    scene.add(mesh);
    walkers.push({ mesh, from: home, to: store, t: Math.random() * -0.6 });
  }
}

function shelfSummary() {
  return CITY_V1.stores.map((s) => {
    const st = state.stores.find((x) => x.id === s.id);
    const brands = st.shelf.map((sl) => state.companies.find((c) => c.id === sl.companyId).name[0] + ':' + sl.stock).join(' ');
    storeMeshes[s.id].material.color.set(st.shelf.length ? 0xd8c26a : 0x8a8a72);
    return `${s.id.padEnd(11)} [${brands}]`;
  }).join('\n');
}

const hud = document.getElementById('hud');
function refreshHud() {
  const lines = state.companies.map((c, i) =>
    `%c${c.name.padEnd(10)} cash=${Math.round(c.cash)} rev=${Math.round(c.cumulativeRevenue)} emp=${c.employees.length}`.replace('%c', ''));
  hud.textContent = `round ${state.round}  ${state.finished ? 'FINISHED — winner: ' + state.companies.find((c) => c.id === state.winnerId).name : ''}\n` +
    lines.join('\n') + '\n\n' + shelfSummary();
  const btn = document.createElement('button');
  btn.textContent = state.finished ? 'restart page to replay' : 'play next round';
  btn.disabled = state.finished;
  btn.onclick = step;
  hud.appendChild(document.createElement('br'));
  hud.appendChild(btn);
}

function step() {
  const before = state.eventLog.length;
  const plans = {};
  state.companies.forEach((co, i) => {
    co._capsPreview = computeCapabilities(co);
    plans[co.id] = withPlotFallback(state, co, policies[i](state, co, state.round + 1));
  });
  playRound(state, plans);
  syncHq();
  spawnWalkers(state.eventLog.slice(before));
  refreshHud();
}

renderer.setAnimationLoop(() => {
  for (const w of walkers) {
    w.t += 0.006;
    const k = Math.max(0, Math.min(1, w.t));
    w.mesh.position.set(w.from.x + (w.to.x - w.from.x) * k, 0.3, w.from.y + (w.to.y - w.from.y) * k);
    w.mesh.visible = w.t >= 0;
    if (w.t > 1.15) w.t = -0.2;                    // loop the walk for readability
  }
  renderer.render(scene, camera);
});
refreshHud();
</script>
</body>
</html>
